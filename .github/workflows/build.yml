name: Build G-Os

on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin shellcheck
      - name: Validate development scripts
        run: |
          bash -n scripts/dev-check.sh scripts/dev-session.sh scripts/dev-watch.sh scripts/install-dev-deps-fedora.sh scripts/install-dev-deps-cachyos.sh
          shellcheck scripts/dev-check.sh scripts/dev-session.sh scripts/dev-watch.sh scripts/install-dev-deps-fedora.sh scripts/install-dev-deps-cachyos.sh
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage
