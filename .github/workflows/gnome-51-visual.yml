name: GNOME Shell 51 visual tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel-visual:
    name: Panel menus and screenshots (GNOME 51)
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      CI: "true"
      G_DEBUG: fatal-criticals
    steps:
      - name: Install GNOME Shell 51 runtime
        run: |
          dnf install -y dbus-daemon glib2 gnome-shell git mutter-devkit nodejs npm sassc
          gnome-shell --version
          gnome-shell --version | grep -E 'GNOME Shell 51([. ]|$)'
      - name: Start the system D-Bus required by GNOME Shell
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork --nopidfile
          test -S /run/dbus/system_bus_socket
          # A container has no logind session; make GNOME Shell use its supported dummy login manager.
          rm -rf /run/systemd/seats
          test ! -e /run/systemd/seats
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run native panel tests and capture screenshots
        run: npm run test:ui -- --run panel
      - name: Upload GNOME screenshots, reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnome-51-panel-visual-results
          path: .cache/g-os-extension/test-runs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
